<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<!-- Make Home Screen version behave like an app on old iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Desk Clock">
<title>Desk Clock</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #15171a;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
}
.dashboard {
    width: 90%;
    max-width: 1000px;
    text-align: center;
}
.greeting {
    font-size: 22px;
    opacity: 0.65;
    margin-bottom: 8px;
    letter-spacing: 1px;
}
.time {
    font-size: 105px;
    font-weight: bold;
    line-height: 1;
    letter-spacing: -4px;
}
.date {
    font-size: 28px;
    margin-top: 14px;
    opacity: 0.85;
}
.divider {
    width: 70%;
    height: 1px;
    background: rgba(255,255,255,0.15);
    margin: 28px auto;
}
.weather-area {
    text-align: center;
}
.weather-icon {
    font-size: 52px;
    display: inline-block;
    vertical-align: middle;
    margin-right: 15px;
}
.weather-info {
    display: inline-block;
    vertical-align: middle;
}
.location {
    font-size: 25px;
    letter-spacing: 3px;
}
.temperature {
    font-size: 48px;
    font-weight: bold;
}
.conditions {
    font-size: 19px;
    opacity: 0.65;
}
.forecast {
    margin-top: 25px;
}
.weather-card {
    display: inline-block;
    padding: 10px 25px;
    margin: 0 5px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    font-size: 20px;
}
.weather-card span {
    opacity: 0.55;
    font-size: 16px;
}
.footer {
    margin-top: 25px;
    font-size: 15px;
    opacity: 0.3;
}
</style>
</head>
<body>
<div class="dashboard">
<div class="greeting" id="greeting">
    Good evening
</div>
<div class="time" id="time">
    --:--
</div>
<div class="date" id="date">
    Loading...
</div>
<div class="divider"></div>
<div class="weather-area">
    <span class="weather-icon" id="weatherIcon">☀</span>
    <div class="weather-info">
        <div class="location">
            MONTRÉAL
        </div>
        <div class="temperature">
            <span id="temperature">--</span>°C
        </div>
        <div class="conditions" id="conditions">
            Loading weather...
        </div>
    </div>
</div>
<div class="forecast">
    <div class="weather-card">
        <span>HIGH</span><br>
        <b id="high">--</b>°
    </div>
    <div class="weather-card">
        <span>LOW</span><br>
        <b id="low">--</b>°
    </div>
</div>
<div class="footer">
    DESK DASHBOARD
</div>
</div>
<script>
/* CLOCK */
function updateClock() {
    var now = new Date();
    var hours = now.getHours();
    var minutes = now.getMinutes();
    var ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12;
    if (hours === 0) {
        hours = 12;
    }
    if (minutes < 10) {
        minutes = "0" + minutes;
    }
    document.getElementById("time").innerHTML =
        hours + ":" + minutes + " " + ampm;
    var hour = now.getHours();
    if (hour < 12) {
        document.getElementById("greeting").innerHTML =
            "Good morning";
    }
    else if (hour < 18) {
        document.getElementById("greeting").innerHTML =
            "Good afternoon";
    }
    else {
        document.getElementById("greeting").innerHTML =
            "Good evening";
    }
    var days = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];
    var months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
    ];
    document.getElementById("date").innerHTML =
        days[now.getDay()] + ", " +
        months[now.getMonth()] + " " +
        now.getDate();
}
/* WEATHER */
function getWeather() {
    var url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=45.5017" +
        "&longitude=-73.5673" +
        "&current_weather=true" +
        "&daily=temperature_2m_max,temperature_2m_min" +
        "&timezone=America%2FToronto";
    var request = new XMLHttpRequest();
    request.open("GET", url, true);
    request.onreadystatechange = function() {
        if (request.readyState == 4) {
            if (request.status == 200) {
                try {
                    var data =
                        JSON.parse(request.responseText);
                    document.getElementById("temperature").innerHTML =
                        Math.round(
                            data.current_weather.temperature
                        );
                    document.getElementById("high").innerHTML =
                        Math.round(
                            data.daily.temperature_2m_max[0]
                        );
                    document.getElementById("low").innerHTML =
                        Math.round(
                            data.daily.temperature_2m_min[0]
                        );
                    document.getElementById("conditions").innerHTML =
                        "Current conditions";
                }
                catch(e) {
                    document.getElementById("conditions").innerHTML =
                        "Weather unavailable";
                }
            }
            else {
                document.getElementById("conditions").innerHTML =
                    "Weather unavailable";
            }
        }
    };
    request.send(null);
}
/* START */
updateClock();
setInterval(updateClock, 1000);
getWeather();
setInterval(getWeather, 1800000);
</script>
</body>
</html>
