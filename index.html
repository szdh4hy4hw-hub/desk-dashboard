<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- iOS 9 Home Screen / Full Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Desk Clock">
<title>Desk Dashboard</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #15171a;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
}
.dashboard {
    width: 90%;
    max-width: 1000px;
    text-align: center;
}
.greeting {
    font-size: 28px;
    font-weight: 300;
    margin-bottom: 5px;
}
.clock {
    font-size: 105px;
    font-weight: 200;
    letter-spacing: -4px;
    line-height: 1;
}
.ampm {
    font-size: 30px;
    vertical-align: 25px;
    margin-left: 8px;
    letter-spacing: 0;
}
.date {
    font-size: 22px;
    font-weight: 300;
    margin-top: 12px;
    opacity: 0.75;
}
.location {
    font-size: 15px;
    letter-spacing: 3px;
    margin-top: 8px;
    opacity: 0.5;
    text-transform: uppercase;
}
.divider {
    width: 80%;
    height: 1px;
    background: #444;
    margin: 30px auto;
}
.weather {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 35px;
}
.weather-icon {
    font-size: 60px;
}
.temperature {
    font-size: 58px;
    font-weight: 200;
}
.condition {
    font-size: 19px;
    opacity: 0.7;
    margin-top: 3px;
}
.highlow {
    display: flex;
    gap: 12px;
}
.temp-card {
    border: 1px solid #444;
    border-radius: 10px;
    padding: 10px 18px;
    min-width: 70px;
}
.temp-label {
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.5;
}
.temp-value {
    font-size: 23px;
    margin-top: 5px;
}
.footer {
    margin-top: 35px;
    font-size: 11px;
    letter-spacing: 4px;
    opacity: 0.3;
}
#weatherError {
    font-size: 16px;
    opacity: 0.5;
}
@media (max-width: 700px) {
    .clock {
        font-size: 70px;
    }
    .weather {
        gap: 15px;
    }
    .temperature {
        font-size: 42px;
    }
}
</style>
</head>
<body>
<div class="dashboard">
    <div class="greeting" id="greeting"></div>
    <div class="clock">
        <span id="time"></span>
        <span class="ampm" id="ampm"></span>
    </div>
    <div class="date" id="date"></div>
    <div class="location">MONTRÉAL</div>
    <div class="divider"></div>
    <div class="weather" id="weather">
        <div class="weather-icon" id="weatherIcon">☁</div>
        <div>
            <div class="temperature" id="temperature">--°</div>
            <div class="condition" id="condition">Loading weather...</div>
        </div>
        <div class="highlow">
            <div class="temp-card">
                <div class="temp-label">HIGH</div>
                <div class="temp-value" id="high">--°</div>
            </div>
            <div class="temp-card">
                <div class="temp-label">LOW</div>
                <div class="temp-value" id="low">--°</div>
            </div>
        </div>
    </div>
    <div class="footer">DESK DASHBOARD</div>
</div>
<script>
function updateClock() {
    var now = new Date();
    var hours = now.getHours();
    var minutes = now.getMinutes();
    var ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12;
    if (hours === 0) hours = 12;
    if (minutes < 10) minutes = "0" + minutes;
    document.getElementById("time").innerHTML =
        hours + ":" + minutes;
    document.getElementById("ampm").innerHTML = ampm;
    var days = [
        "Sunday", "Monday", "Tuesday", "Wednesday",
        "Thursday", "Friday", "Saturday"
    ];
    var months = [
        "January", "February", "March", "April",
        "May", "June", "July", "August",
        "September", "October", "November", "December"
    ];
    document.getElementById("date").innerHTML =
        days[now.getDay()] + ", " +
        months[now.getMonth()] + " " +
        now.getDate();
    var hour = now.getHours();
    var greeting;
    if (hour < 12) {
        greeting = "Good morning";
    } else if (hour < 18) {
        greeting = "Good afternoon";
    } else {
        greeting = "Good evening";
    }
    document.getElementById("greeting").innerHTML = greeting;
}
updateClock();
setInterval(updateClock, 1000);
/* WEATHER */
function loadWeather() {
    var url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=45.5017" +
        "&longitude=-73.5673" +
        "&current_weather=true" +
        "&daily=temperature_2m_max,temperature_2m_min" +
        "&timezone=GMT";
    var request = new XMLHttpRequest();
    request.open("GET", url, true);
    request.onreadystatechange = function() {
        if (request.readyState !== 4) {
            return;
        }
        if (request.status === 200) {
            try {
                var data = JSON.parse(request.responseText);
                var current = data.current_weather;
                if (current) {
                    document.getElementById("temperature").innerHTML =
                        Math.round(current.temperature) + "°C";
                    document.getElementById("condition").innerHTML =
                        weatherDescription(current.weathercode);
                    document.getElementById("weatherIcon").innerHTML =
                        weatherIcon(current.weathercode);
                }
                if (data.daily) {
                    if (data.daily.temperature_2m_max) {
                        document.getElementById("high").innerHTML =
                            Math.round(data.daily.temperature_2m_max[0]) + "°C";
                    }
                    if (data.daily.temperature_2m_min) {
                        document.getElementById("low").innerHTML =
                            Math.round(data.daily.temperature_2m_min[0]) + "°C";
                    }
                }
            } catch (e) {
                document.getElementById("condition").innerHTML =
                    "Weather unavailable";
            }
        } else {
            document.getElementById("condition").innerHTML =
                "Weather unavailable";
        }
    };
    request.onerror = function() {
        document.getElementById("condition").innerHTML =
            "Weather unavailable";
    };
    request.send(null);
}
function weatherDescription(code) {
    if (code === 0) return "Clear sky";
    if (code === 1) return "Mainly clear";
    if (code === 2) return "Partly cloudy";
    if (code === 3) return "Overcast";
    if (code === 45 || code === 48) return "Fog";
    if (code >= 51 && code <= 57) return "Drizzle";
    if (code >= 61 && code <= 67) return "Rain";
    if (code >= 71 && code <= 77) return "Snow";
    if (code >= 80 && code <= 82) return "Rain showers";
    if (code >= 85 && code <= 86) return "Snow showers";
    if (code >= 95) return "Thunderstorm";
    return "Weather";
}
function weatherIcon(code) {
    if (code === 0) return "☀";
    if (code === 1 || code === 2) return "⛅";
    if (code === 3) return "☁";
    if (code === 45 || code === 48) return "🌫";
    if (code >= 51 && code <= 67) return "🌧";
    if (code >= 71 && code <= 86) return "❄";
    if (code >= 95) return "⛈";
    return "☁";
}
loadWeather();
</script>
</body>
</html>
