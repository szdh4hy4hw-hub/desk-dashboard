<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desk Dashboard</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #111;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
}
.dashboard {
    width: 90%;
    max-width: 1000px;
    text-align: center;
}
.time {
    font-size: 105px;
    font-weight: bold;
    line-height: 1;
    letter-spacing: -3px;
}
.date {
    font-size: 30px;
    margin-top: 18px;
}
.location {
    font-size: 27px;
    margin-top: 38px;
}
.weather {
    font-size: 52px;
    margin-top: 8px;
    font-weight: bold;
}
.highlow {
    font-size: 25px;
    margin-top: 8px;
}
.footer {
    font-size: 18px;
    margin-top: 40px;
    opacity: 0.5;
}
</style>
</head>
<body>
<div class="dashboard">
<div class="time" id="time">--:--</div>
<div class="date" id="date">Loading...</div>
<div class="location">MONTRÉAL</div>
<div class="weather">
    <span id="temperature">--</span>°C
</div>
<div class="highlow">
    H: <span id="high">--</span>° &nbsp;&nbsp;
    L: <span id="low">--</span>°
</div>
<div class="footer">
    Desk Dashboard
</div>
</div>
<script>
function updateClock() {
    var now = new Date();
    var hours = now.getHours();
    var minutes = now.getMinutes();
    var ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12;
    if (hours === 0) {
        hours = 12;
    }
    if (minutes < 10) {
        minutes = "0" + minutes;
    }
    document.getElementById("time").innerHTML =
        hours + ":" + minutes + " " + ampm;
    var days = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];
    var months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
    ];
    document.getElementById("date").innerHTML =
        days[now.getDay()] + ", " +
        months[now.getMonth()] + " " +
        now.getDate();
}
function getWeather() {
    var url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=45.5017" +
        "&longitude=-73.5673" +
        "&current_weather=true" +
        "&daily=temperature_2m_max,temperature_2m_min" +
        "&timezone=America%2FToronto";
    var request = new XMLHttpRequest();
    request.open("GET", url, true);
    request.onreadystatechange = function() {
        if (request.readyState === 4 &&
            request.status === 200) {
            var data = JSON.parse(request.responseText);
            document.getElementById("temperature").innerHTML =
                Math.round(
                    data.current_weather.temperature
                );
            document.getElementById("high").innerHTML =
                Math.round(
                    data.daily.temperature_2m_max[0]
                );
            document.getElementById("low").innerHTML =
                Math.round(
                    data.daily.temperature_2m_min[0]
                );
        }
    };
    request.send();
}
updateClock();
setInterval(updateClock, 1000);
getWeather();
setInterval(getWeather, 1800000);
</script>
</body>
</html>
