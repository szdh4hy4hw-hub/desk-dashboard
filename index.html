<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desk Dashboard</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #15171a;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
}
.dashboard {
    width: 90%;
    max-width: 1000px;
    text-align: center;
}
.greeting {
    font-size: 22px;
    opacity: 0.65;
    margin-bottom: 8px;
    letter-spacing: 1px;
}
.time {
    font-size: 105px;
    font-weight: bold;
    line-height: 1;
    letter-spacing: -4px;
}
.date {
    font-size: 28px;
    margin-top: 14px;
    opacity: 0.85;
}
.divider {
    width: 70%;
    height: 1px;
    background: rgba(255,255,255,0.15);
    margin: 28px auto;
}
.weather-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
}
.weather-icon {
    font-size: 60px;
}
.location {
    font-size: 25px;
    letter-spacing: 3px;
    margin-bottom: 4px;
}
.temperature {
    font-size: 48px;
    font-weight: bold;
}
.conditions {
    font-size: 19px;
    opacity: 0.65;
}
.forecast {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 15px;
}
.weather-card {
    padding: 10px 25px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    font-size: 20px;
}
.weather-card span {
    opacity: 0.55;
    font-size: 16px;
}
.footer {
    margin-top: 25px;
    font-size: 15px;
    opacity: 0.3;
}
</style>
</head>
<body>
<div class="dashboard">
<div class="greeting" id="greeting">
    Good evening
</div>
<div class="time" id="time">
    --:--
</div>
<div class="date" id="date">
    Loading...
</div>
<div class="divider"></div>
<div class="weather-area">
    <div class="weather-icon" id="weatherIcon">
        ☀️
    </div>
    <div>
        <div class="location">MONTRÉAL</div>
        <div class="temperature">
            <span id="temperature">--</span>°C
        </div>
        <div class="conditions" id="conditions">
            Weather loading...
        </div>
    </div>
</div>
<div class="forecast">
    <div class="weather-card">
        <span>HIGH</span><br>
        <b id="high">--</b>°
    </div>
    <div class="weather-card">
        <span>LOW</span><br>
        <b id="low">--</b>°
    </div>
</div>
<div class="footer">
    DESK DASHBOARD
</div>
</div>
<script>
function updateClock() {
    var now = new Date();
    var hours = now.getHours();
    var minutes = now.getMinutes();
    var ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12;
    if (hours === 0) {
        hours = 12;
    }
    if (minutes < 10) {
        minutes = "0" + minutes;
    }
    document.getElementById("time").innerHTML =
        hours + ":" + minutes + " " + ampm;
    var hour = now.getHours();
    var greeting;
    if (hour < 12) {
        greeting = "Good morning";
    } else if (hour < 18) {
        greeting = "Good afternoon";
    } else {
        greeting = "Good evening";
    }
    document.getElementById("greeting").innerHTML =
        greeting;
    var days = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];
    var months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
    ];
    document.getElementById("date").innerHTML =
        days[now.getDay()] + ", " +
        months[now.getMonth()] + " " +
        now.getDate();
}
function getWeather() {
    var url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=45.5017" +
        "&longitude=-73.5673" +
        "&current_weather=true" +
        "&daily=temperature_2m_max,temperature_2m_min,weathercode" +
        "&timezone=America%2FToronto";
    var request = new XMLHttpRequest();
    request.open("GET", url, true);
    request.onreadystatechange = function() {
        if (request.readyState === 4 &&
            request.status === 200) {
            var data = JSON.parse(request.responseText);
            var temp =
                Math.round(
                    data.current_weather.temperature
                );
            var high =
                Math.round(
                    data.daily.temperature_2m_max[0]
                );
            var low =
                Math.round(
                    data.daily.temperature_2m_min[0]
                );
            var code =
                data.current_weather.weathercode;
            document.getElementById("temperature").innerHTML =
                temp;
            document.getElementById("high").innerHTML =
                high;
            document.getElementById("low").innerHTML =
                low;
            var icon = "☀️";
            var description = "Clear";
            if (code >= 1 && code <= 3) {
                icon = "⛅";
                description = "Partly cloudy";
            }
            if (code >= 45 && code <= 48) {
                icon = "🌫️";
                description = "Foggy";
            }
            if (code >= 51 && code <= 67) {
                icon = "🌧️";
                description = "Rain";
            }
            if (code >= 71 && code <= 77) {
                icon = "❄️";
                description = "Snow";
            }
            if (code >= 80 && code <= 82) {
                icon = "🌦️";
                description = "Showers";
            }
            if (code >= 95) {
                icon = "⛈️";
                description = "Thunderstorm";
            }
            document.getElementById("weatherIcon").innerHTML =
                icon;
            document.getElementById("conditions").innerHTML =
                description;
        }
    };
    request.send();
}
updateClock();
setInterval(updateClock, 1000);
getWeather();
setInterval(getWeather, 1800000);
</script>
</body>
</html>
